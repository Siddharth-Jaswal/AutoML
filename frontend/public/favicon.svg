<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B344D" />
      <stop offset="100%" stop-color="#181422" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#FAF0E6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9FA1FF" stop-opacity="0.10" />
    </linearGradient>

    <!-- Bot Stroke Gradient -->
    <linearGradient id="botGrad" x1="32" y1="14" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF0E6" />
    </linearGradient>

    <!-- Drop Shadow / Ambient Glow -->
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#9FA1FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="1.2" />

  <!-- Ambient Backdrop Halo -->
  <circle cx="32" cy="34" r="16" fill="#9FA1FF" fill-opacity="0.12" />

  <!-- Lucide Bot Emoticon -->
  <g filter="url(#botGlow)" stroke="url(#botGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna -->
    <path d="M32 24V16H24" />

    <!-- Head with subtle translucent visor fill -->
    <rect x="16" y="24" width="32" height="24" rx="5" fill="#1E1A29" fill-opacity="0.5" />

    <!-- Ears / Bolts -->
    <path d="M11 36h5" />
    <path d="M48 36h5" />

    <!-- Eyes -->
    <path d="M26 33v6" />
    <path d="M38 33v6" />
  </g>
</svg>
